# cPanel Git Version Control deploy for profile.wheretospot.com.
# CHECK FIRST: in cPanel > Domains, confirm the document root of profile.wheretospot.com. If it is not
# /home/viorowzb/profile.wheretospot.com, change DEPLOYPATH below before the first deploy.
# Leads are stored in /home/viorowzb/profile-data (outside the website) and are never touched by a deploy.
# Files on the server that are not in this repo (config.local.php, the old contact.php) are left alone.
deployment:
  tasks:
    - export DEPLOYPATH=/home/viorowzb/profile.wheretospot.com/
    - /bin/mkdir -p $DEPLOYPATH /home/viorowzb/profile-data
    - /bin/chmod 700 /home/viorowzb/profile-data
    - /bin/cp index.html support.js image-slot.js leads.php $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH/.htaccess
    - /bin/cp -R images api $DEPLOYPATH
    - /bin/cp api/lib/.htaccess $DEPLOYPATH/api/lib/.htaccess
